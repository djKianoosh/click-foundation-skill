[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "click-foundation-skill"
version = "0.2.0"
description = "Agent skill and CLI coach for the Click methodology by Jake Knapp and John Zeratsky"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
click-coach = "click_coach:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["skills/click-foundation/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
